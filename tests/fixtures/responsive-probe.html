<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive layout probe</title>
    <style>
      html,
      body {
        margin: 0;
      }

      iframe {
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="site" src="/index.html" title="Atlas responsive test page"></iframe>
    <div id="result" data-json="pending"></div>
    <script>
      const frame = document.getElementById("site");
      const output = document.getElementById("result");
      const searchParams = new URLSearchParams(window.location.search);
      const requestedWidth = Number.parseInt(searchParams.get("width"), 10);
      const requestedSection = searchParams.get("section");
      const captureMode = searchParams.has("capture");

      if (Number.isFinite(requestedWidth)) frame.style.width = `${requestedWidth}px`;
      if (requestedSection) frame.src = `/index.html#${encodeURIComponent(requestedSection)}`;

      const isVisible = (element, view) => {
        if (!element) return false;
        const styles = view.getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return styles.display !== "none" && styles.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
      };

      const directChildrenFit = (element) => {
        const bounds = element.getBoundingClientRect();
        return Array.from(element.children).every((child) => {
          const rect = child.getBoundingClientRect();
          return rect.left >= bounds.left - 1 && rect.right <= bounds.right + 1;
        });
      };

      const directChildrenDoNotOverlap = (element) => {
        const rects = Array.from(element.children)
          .filter((child) => isVisible(child, frame.contentWindow))
          .map((child) => child.getBoundingClientRect())
          .sort((left, right) => left.left - right.left);
        return rects.every((rect, index) => index === 0 || rect.left >= rects[index - 1].right - 1);
      };

      const maxItemsPerRow = (element) => {
        const rows = new Map();
        Array.from(element.children).forEach((child) => {
          const top = Math.round(child.getBoundingClientRect().top);
          rows.set(top, (rows.get(top) || 0) + 1);
        });
        return Math.max(...rows.values());
      };

      const relativeLuminance = (color) => {
        const channels = color.match(/[\d.]+/g)?.slice(0, 3).map(Number) || [];
        if (channels.length !== 3) return 0;
        const linear = channels.map((channel) => {
          const value = channel / 255;
          return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
        });
        return (0.2126 * linear[0]) + (0.7152 * linear[1]) + (0.0722 * linear[2]);
      };

      frame.addEventListener("load", () => {
        if (captureMode) {
          const captureStyles = frame.contentDocument.createElement("style");
          captureStyles.textContent = `
            [data-reveal] {
              opacity: 1 !important;
              visibility: visible !important;
              transform: none !important;
            }
          `;
          frame.contentDocument.head.append(captureStyles);
          window.setTimeout(() => {
            const view = frame.contentWindow;
            view.ScrollTrigger?.getAll().forEach((trigger) => trigger.kill(true));
            view.gsap?.globalTimeline.pause();
            frame.contentDocument.documentElement.style.scrollBehavior = "auto";
            if (requestedSection) {
              frame.contentDocument.getElementById(requestedSection)?.scrollIntoView({ block: "start" });
            }
          }, 650);
        }
        window.setTimeout(async () => {
          const doc = frame.contentDocument;
          const view = frame.contentWindow;
          const desktopNavLink = doc.querySelector(".atlas-topline [data-nav-link]");
          const desktopNav = desktopNavLink ? desktopNavLink.parentElement : null;
          const mobileNav = doc.querySelector(".mobile-nav");
          const topLine = doc.querySelector(".atlas-topline");
          const brand = doc.querySelector(".atlas-topline > a > span:last-child");
          const heroStage = doc.querySelector(".hero-reference-stage");
          const heroShell = doc.querySelector(".hero-reference-shell");
          const heroCopy = doc.querySelector(".hero-copy-panel");
          const heroMedia = doc.querySelector(".hero-photo-bezel");
          const trainingSelector = doc.querySelector(".training-selector");
          const imagePlaceholders = Array.from(doc.querySelectorAll("[data-image-placeholder]"));
          const desktopRail = doc.querySelector(".hero-rail");
          const desktopNavLinks = Array.from(doc.querySelectorAll(".atlas-topline > div:first-of-type > [data-nav-link]"));
          const postHeroShells = Array.from(doc.querySelectorAll("main > .anchor-section:not(#home) > .page-shell"));
          const gridSelectors = [
            ".training-selector",
            ".equipment-hero",
            ".training-path",
            ".coach-profile-grid",
            ".lifting-method-choice",
            ".contact-layout",
            ".atlas-fit-shell"
          ];
          const overflowingGrids = [];

          gridSelectors.forEach((selector) => {
            doc.querySelectorAll(selector).forEach((element, index) => {
              if (!directChildrenFit(element)) overflowingGrids.push(`${selector}:${index}`);
            });
          });

          const brandStyles = brand ? view.getComputedStyle(brand) : null;
          const brandLineHeight = brandStyles ? Number.parseFloat(brandStyles.lineHeight) : 0;
          const brandSingleLine = !isVisible(brand, view) || brand.getBoundingClientRect().height <= brandLineHeight * 1.35;
          const heroMediaRect = heroMedia.getBoundingClientRect();
          const heroStageRect = heroStage.getBoundingClientRect();
          const heroShellRect = heroShell.getBoundingClientRect();
          const heroEquipmentRect = heroMedia.parentElement.getBoundingClientRect();
          const heroContainsContent = Array.from(heroShell.children).every((child) => {
            const rect = child.getBoundingClientRect();
            return rect.top >= heroStageRect.top - 1 && rect.bottom <= heroStageRect.bottom + 1;
          });
          const railParts = [
            doc.querySelector(".hero-rail-icon"),
            doc.querySelector(".hero-rail-copy"),
            doc.querySelector(".hero-rail-location")
          ].filter((element) => isVisible(element, view));
          const railBounds = desktopRail.getBoundingClientRect();
          const railPartBounds = railParts
            .map((element) => element.getBoundingClientRect())
            .sort((first, second) => first.top - second.top);
          const railContentFits = !isVisible(desktopRail, view) || (
            railPartBounds.every((rect) => rect.top >= railBounds.top && rect.bottom <= railBounds.bottom)
            && railPartBounds.every((rect, index) => index === 0 || rect.top >= railPartBounds[index - 1].bottom)
          );
          const inactiveNavColors = desktopNavLinks
            .filter((link) => !link.classList.contains("is-active") && !link.hasAttribute("aria-current"))
            .map((link) => view.getComputedStyle(link).color);
          const phoneLink = doc.querySelector('a[href="tel:+16232165662"]');
          const googleReviewLink = doc.querySelector(".floating-google-review");
          const googleReviewStars = Array.from(doc.querySelectorAll(".floating-google-review-star"));
          const testimonialFaq = doc.querySelector(".testimonial-faq");
          const testimonialTabs = Array.from(doc.querySelectorAll("[data-testimonial-tab]"));
          const testimonialQuestions = Array.from(doc.querySelectorAll("[data-testimonial-question]"));
          const testimonialAvatars = Array.from(doc.querySelectorAll("[data-testimonial-avatar]"));
          const testimonialRails = Array.from(doc.querySelectorAll("[data-testimonial-rail]"));
          const visibleTestimonialRail = testimonialRails.find((rail) => isVisible(rail, view));
          const testimonialRailsConfigured = testimonialRails.length === 2
            && testimonialRails.every((rail) => rail.querySelectorAll(".testimonial-response-card").length === 3)
            && visibleTestimonialRail?.scrollWidth > visibleTestimonialRail?.clientWidth;
          const firstTestimonialRailControls = visibleTestimonialRail
            ?.closest("[data-testimonial-rail-shell]")
            ?.querySelector(".testimonial-rail-controls");
          const floatingTrainingCta = doc.querySelector("[data-floating-training-cta]");
          const visibleRailShell = visibleTestimonialRail?.closest("[data-testimonial-rail-shell]");
          const visibleRailPrevious = visibleRailShell?.querySelector("[data-testimonial-rail-previous]");
          const visibleRailNext = visibleRailShell?.querySelector("[data-testimonial-rail-next]");
          const visibleRailStatus = visibleRailShell?.querySelector("[data-testimonial-rail-status]");
          const visibleRailFirstCard = visibleTestimonialRail?.querySelector(".testimonial-response-card");
          const waitFor = async (predicate, timeout = 500) => {
            const startedAt = performance.now();
            while (!predicate() && performance.now() - startedAt < timeout) {
              await new Promise((resolve) => window.setTimeout(resolve, 25));
            }
            return predicate();
          };
          const coachingPanel = doc.getElementById("testimonial-coaching-panel");
          const gymPanel = doc.getElementById("testimonial-gym-panel");
          const gymTab = doc.querySelector('[data-testimonial-tab="gym"]');
          testimonialFaq?.scrollIntoView({ block: "start" });
          const testimonialFloatingCtaHidden = await waitFor(() =>
            !floatingTrainingCta?.classList.contains("is-visible")
            && floatingTrainingCta?.getAttribute("aria-hidden") === "true"
            && floatingTrainingCta?.tabIndex === -1
          );
          visibleTestimonialRail.style.scrollBehavior = "auto";
          visibleTestimonialRail?.scrollTo({ left: 0, behavior: "auto" });
          visibleTestimonialRail?.dispatchEvent(new Event("scroll"));
          const initialRailControlsReady = await waitFor(() => visibleRailPrevious?.disabled === true
            && visibleRailNext?.disabled === false
            && visibleRailStatus?.textContent.trim() === "01 / 03");
          visibleRailNext?.click();
          const testimonialArrowAdvanced = await waitFor(() => visibleTestimonialRail?.scrollLeft > 2
            && visibleRailPrevious?.disabled === false
            && visibleRailStatus?.textContent.trim() === "02 / 03");
          const railAfterArrow = {
            scrollLeft: visibleTestimonialRail?.scrollLeft,
            previousDisabled: visibleRailPrevious?.disabled,
            nextDisabled: visibleRailNext?.disabled,
            status: visibleRailStatus?.textContent.trim()
          };
          visibleTestimonialRail?.scrollTo({ left: visibleTestimonialRail.scrollWidth, behavior: "auto" });
          visibleTestimonialRail?.dispatchEvent(new Event("scroll"));
          const expectedEndStatus = requestedWidth <= 640 ? "03 / 03" : "02 / 03";
          const testimonialRailReachedEnd = await waitFor(() => visibleRailNext?.disabled === true
            && visibleRailStatus?.textContent.trim() === expectedEndStatus);
          const railAfterEnd = {
            scrollLeft: visibleTestimonialRail?.scrollLeft,
            maxScroll: visibleTestimonialRail ? visibleTestimonialRail.scrollWidth - visibleTestimonialRail.clientWidth : null,
            nextDisabled: visibleRailNext?.disabled,
            status: visibleRailStatus?.textContent.trim()
          };
          const desktopCardTarget = visibleTestimonialRail
            ? (visibleTestimonialRail.clientWidth - 16) / 2
            : 0;
          const mobileCardTarget = visibleTestimonialRail ? visibleTestimonialRail.clientWidth * 0.88 : 0;
          const testimonialCardSizingReady = visibleRailFirstCard
            ? Math.abs(visibleRailFirstCard.getBoundingClientRect().width - (requestedWidth <= 640 ? mobileCardTarget : desktopCardTarget)) < 2
            : false;
          visibleTestimonialRail?.scrollTo({ left: 0, behavior: "auto" });
          visibleTestimonialRail?.dispatchEvent(new Event("scroll"));
          await new Promise((resolve) => window.setTimeout(resolve, 50));
          gymTab?.click();
          gymTab?.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
          const keyboardTabNavigationReady = testimonialTabs[0]?.getAttribute("aria-selected") === "true"
            && doc.activeElement === testimonialTabs[0];
          gymTab?.click();
          const gymQuestions = Array.from(gymPanel?.querySelectorAll("[data-testimonial-question]") || []);
          const firstGymQuestion = gymQuestions[0];
          const secondGymQuestion = gymQuestions[1];
          secondGymQuestion?.click();
          const firstGymResponse = firstGymQuestion
            ? doc.getElementById(firstGymQuestion.getAttribute("aria-controls"))
            : null;
          const secondGymResponse = secondGymQuestion
            ? doc.getElementById(secondGymQuestion.getAttribute("aria-controls"))
            : null;
          (firstGymResponse?.getAnimations() || []).forEach((animation) => animation.finish());
          await Promise.resolve();
          const collapsedQuestionOpensReady = firstGymQuestion?.getAttribute("aria-expanded") === "false"
            && firstGymResponse?.hidden === true
            && secondGymQuestion?.getAttribute("aria-expanded") === "true"
            && secondGymResponse?.hidden === false
            && secondGymQuestion?.closest(".testimonial-faq-item")?.classList.contains("is-open");
          const gymCategoryStateReady = gymTab?.getAttribute("aria-selected") === "true"
            && coachingPanel?.hidden === true
            && gymPanel?.hidden === false;

          if (captureMode) {
            testimonialTabs[0]?.click();
            testimonialFaq?.scrollIntoView({ block: "start" });
            floatingTrainingCta.style.transition = "none";
            floatingTrainingCta?.classList.add("is-visible");
            void floatingTrainingCta?.offsetWidth;
          }
          const testimonialFaqBounds = testimonialFaq?.getBoundingClientRect();
          const testimonialOverflowingChildren = testimonialFaqBounds
            ? Array.from(testimonialFaq.querySelectorAll("*")).filter((element) => {
                if (!isVisible(element, view)) return false;
                const bounds = element.getBoundingClientRect();
                return bounds.left < testimonialFaqBounds.left - 1 || bounds.right > testimonialFaqBounds.right + 1;
              }).map((element) => {
                const bounds = element.getBoundingClientRect();
                return { tag: element.tagName, className: element.className, left: bounds.left, right: bounds.right };
              }).slice(0, 12)
            : [];
          const assistantHourRows = Array.from(doc.querySelectorAll(".coaching-hours-row"))
            .filter((row) => row.textContent.includes("Assistant coach"));
          const philosophyParagraphs = Array.from(doc.querySelectorAll(".coach-info-card-accent > div:last-child > p:not(.coach-info-kicker)"));
          const philosophyParagraphStyles = philosophyParagraphs.map((paragraph) => {
            const styles = view.getComputedStyle(paragraph);
            return {
              color: styles.color,
              fontSize: styles.fontSize,
              lineHeight: styles.lineHeight
            };
          });
          const accentGreen = view.getComputedStyle(doc.querySelector(".coach-info-kicker")).color;
          const fieldGreen = view.getComputedStyle(imagePlaceholders[0]).backgroundColor;
          const navAccentProbe = desktopNavLinks[0];
          const navAccentProbeWasActive = navAccentProbe?.classList.contains("is-active");
          const navAccentProbeTransition = navAccentProbe?.style.transition;
          if (navAccentProbe) navAccentProbe.style.transition = "none";
          navAccentProbe?.classList.add("is-active");
          const activeNavColor = navAccentProbe ? view.getComputedStyle(navAccentProbe).color : null;
          if (!navAccentProbeWasActive) navAccentProbe?.classList.remove("is-active");
          if (navAccentProbe) navAccentProbe.style.transition = navAccentProbeTransition;
          const result = {
            viewportWidth: view.innerWidth,
            documentFits: doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1,
            desktopNavVisible: isVisible(desktopNav, view),
            mobileNavVisible: isVisible(mobileNav, view),
            headerCtaVisible: isVisible(doc.querySelector(".header-flow-button"), view),
            heroRailVisible: isVisible(doc.querySelector(".hero-rail"), view),
            brandSingleLine,
            headerFits: directChildrenFit(topLine),
            headerItemsDoNotOverlap: directChildrenDoNotOverlap(topLine),
            heroCopyFits: heroCopy.scrollWidth <= heroCopy.clientWidth + 1,
            heroContainsContent,
            heroMediaFitsHorizontally: heroMediaRect.left >= -1 && heroMediaRect.right <= view.innerWidth + 1,
            heroMediaStartsInViewport: heroMediaRect.top < view.innerHeight,
            heroMediaTop: heroMediaRect.top,
            heroMediaLeft: heroMediaRect.left,
            heroMediaRight: heroMediaRect.right,
            heroShellLeft: heroShellRect.left,
            heroShellRight: heroShellRect.right,
            heroEquipmentLeft: heroEquipmentRect.left,
            heroEquipmentRight: heroEquipmentRect.right,
            trainingItemsPerRow: maxItemsPerRow(trainingSelector),
            imagePlaceholderCount: imagePlaceholders.length,
            imagePlaceholdersReady: imagePlaceholders.every((element) => {
              const tape = view.getComputedStyle(element, "::after");
              return tape.content === '"UNDER CONSTRUCTION"' && tape.display !== "none";
            }),
            imagePlaceholderTapeValues: imagePlaceholders.map((element) => {
              const tape = view.getComputedStyle(element, "::after");
              return { content: tape.content, display: tape.display };
            }),
            imagePlaceholdersAreGreen: imagePlaceholders.every((element) =>
              view.getComputedStyle(element).backgroundColor === "rgb(89, 107, 94)"
            ),
            imagePlaceholderColors: imagePlaceholders.map((element) =>
              view.getComputedStyle(element).backgroundColor
            ),
            imagePlaceholderMediaRemoved: imagePlaceholders.every((element) => {
              const nodes = [element, ...element.querySelectorAll("*")];
              return !element.querySelector("img") && nodes.every((node) =>
                !view.getComputedStyle(node).backgroundImage.includes("url(")
              );
            }),
            postHeroShellsClearRail: !isVisible(desktopRail, view) || postHeroShells.every((element) =>
              element.getBoundingClientRect().left >= desktopRail.getBoundingClientRect().right - 1
            ),
            railContentFits,
            railPartBounds: railPartBounds.map((rect) => ({ top: rect.top, bottom: rect.bottom })),
            inactiveNavColorsConsistent: new Set(inactiveNavColors).size <= 1,
            phoneLinkCorrect: phoneLink?.textContent.trim() === "(623) 216-5662",
            googleReviewLinkReady: googleReviewLink?.tagName === "A"
              && googleReviewLink.href === "https://share.google/ATi5f1iM6d3ljoALV"
              && view.getComputedStyle(googleReviewLink).pointerEvents !== "none",
            googleReviewRatingReady: googleReviewStars.length === 5
              && googleReviewStars.every((star) => star.textContent.trim() === "★")
              && googleReviewLink?.textContent.includes("5.0")
              && Boolean(googleReviewLink?.querySelector('[aria-label="Google rating: 5 out of 5"]')),
            testimonialFaqReady: isVisible(testimonialFaq, view)
              && testimonialTabs.length === 2
              && testimonialQuestions.length === 10
              && testimonialAvatars.length >= 3
              && testimonialRailsConfigured
              && testimonialAvatars.every((avatar) => {
                const bounds = avatar.getBoundingClientRect();
                return Math.abs(bounds.width - bounds.height) < 0.1;
              })
              && testimonialFaq.scrollWidth <= testimonialFaq.clientWidth + 1,
            testimonialFaqMetrics: {
              visible: isVisible(testimonialFaq, view),
              tabCount: testimonialTabs.length,
              questionCount: testimonialQuestions.length,
              avatarCount: testimonialAvatars.length,
              railCount: testimonialRails.length,
              railsConfigured: testimonialRailsConfigured,
              visibleRailScrollWidth: visibleTestimonialRail?.scrollWidth,
              visibleRailClientWidth: visibleTestimonialRail?.clientWidth,
              squareAvatars: testimonialAvatars.every((avatar) => {
                const bounds = avatar.getBoundingClientRect();
                return Math.abs(bounds.width - bounds.height) < 0.1;
              }),
              avatarSizes: testimonialAvatars.filter((avatar) => isVisible(avatar, view)).map((avatar) => {
                const bounds = avatar.getBoundingClientRect();
                return { width: bounds.width, height: bounds.height };
              }),
              scrollWidth: testimonialFaq?.scrollWidth,
              clientWidth: testimonialFaq?.clientWidth,
              overflowingChildren: testimonialOverflowingChildren
            },
            testimonialInteractionsReady: gymCategoryStateReady
              && keyboardTabNavigationReady
              && collapsedQuestionOpensReady
              && initialRailControlsReady
              && testimonialArrowAdvanced
              && testimonialRailReachedEnd
              && testimonialCardSizingReady,
            testimonialFloatingCtaHidden,
            testimonialControlsClearFloatingCta: (() => {
              if (!isVisible(firstTestimonialRailControls, view) || !isVisible(floatingTrainingCta, view)) return true;
              const controls = firstTestimonialRailControls.getBoundingClientRect();
              const floating = floatingTrainingCta.getBoundingClientRect();
              return controls.right <= floating.left || controls.left >= floating.right
                || controls.bottom <= floating.top || controls.top >= floating.bottom;
            })(),
            testimonialInteractionMetrics: {
              gymSelected: gymTab?.getAttribute("aria-selected"),
              coachingHidden: coachingPanel?.hidden,
              gymHidden: gymPanel?.hidden,
              keyboardTabNavigationReady,
              collapsedQuestionOpensReady,
              initialRailControlsReady,
              testimonialArrowAdvanced,
              testimonialRailReachedEnd,
              railAfterArrow,
              railAfterEnd,
              testimonialCardSizingReady,
              firstExpanded: firstGymQuestion?.getAttribute("aria-expanded"),
              firstResponseHidden: firstGymResponse?.hidden,
              secondExpanded: secondGymQuestion?.getAttribute("aria-expanded"),
              secondResponseHidden: secondGymResponse?.hidden,
              secondItemOpen: secondGymQuestion?.closest(".testimonial-faq-item")?.classList.contains("is-open")
            },
            assistantHoursHidden: assistantHourRows.every((row) => !isVisible(row, view)),
            accentGreenIsLighterThanFieldGreen: relativeLuminance(accentGreen) > relativeLuminance(fieldGreen),
            accentGreenMatchesActiveNavigation: !isVisible(desktopNav, view) || activeNavColor === accentGreen,
            atlasGreenColors: { accentGreen, fieldGreen, activeNavColor },
            philosophyBodyTypographyConsistent: philosophyParagraphStyles.length === 2
              && philosophyParagraphStyles.every((styles) =>
                styles.color === philosophyParagraphStyles[0].color
                && styles.fontSize === philosophyParagraphStyles[0].fontSize
                && styles.lineHeight === philosophyParagraphStyles[0].lineHeight
              ),
            philosophyParagraphStyles,
            overflowingGrids
          };

          const axeScript = doc.createElement("script");
          axeScript.src = "/node_modules/axe-core/axe.min.js";
          await new Promise((resolve, reject) => {
            axeScript.addEventListener("load", resolve, { once: true });
            axeScript.addEventListener("error", reject, { once: true });
            doc.head.append(axeScript);
          });
          const ariaAudit = await view.axe.run(doc, {
            runOnly: {
              type: "rule",
              values: ["aria-allowed-attr", "aria-prohibited-attr", "aria-valid-attr", "aria-valid-attr-value", "aria-roles"]
            }
          });
          result.ariaTreeViolations = ariaAudit.violations.map((violation) => ({
            id: violation.id,
            targets: violation.nodes.flatMap((node) => node.target)
          }));

          output.dataset.json = encodeURIComponent(JSON.stringify(result));
        }, 900);
      });
    </script>
  </body>
</html>
